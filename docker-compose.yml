# =====================================================================
#  docker-compose.yml - Orquestación de los 3 contenedores del proyecto
#  ---------------------------------------------------------------------
#  Define los servicios que componen la aplicación:
#    - app : Laravel + Apache + PHP (construido desde el Dockerfile)
#    - db  : Base de datos MariaDB
#    - pma : phpMyAdmin para gestionar la base de datos por navegador
# =====================================================================

services:

  # ---------------------------------------------------------------
  # Servicio 1: APP (Laravel + Apache)
  # ---------------------------------------------------------------
  app:
    build: .                              # construye usando el Dockerfile de esta carpeta
    container_name: ghc_app
    ports:
      - "8080:80"                         # http://localhost:8080 → puerto 80 del contenedor
    volumes:
      - .:/var/www/html                   # monta el código del proyecto dentro del contenedor
    depends_on:
      - db                                # espera a que la BD esté lista
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: grand_hotel_continental
      DB_USERNAME: laravel
      DB_PASSWORD: laravel1234


  # ---------------------------------------------------------------
  # Servicio 2: DB (MariaDB)
  # ---------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: ghc_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: grand_hotel_continental
      MARIADB_USER: laravel
      MARIADB_PASSWORD: laravel1234
      MARIADB_ROOT_PASSWORD: root1234
    volumes:
      - db_data:/var/lib/mysql            # los datos persisten aunque pare el contenedor
    ports:
      - "3307:3306"                       # se accede en localhost:3307 desde tu PC


  # ---------------------------------------------------------------
  # Servicio 3: PMA (phpMyAdmin)
  # ---------------------------------------------------------------
  pma:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ghc_pma
    restart: unless-stopped
    ports:
      - "8081:80"                         # http://localhost:8081
    environment:
      PMA_HOST: db                        # conecta con el contenedor de MariaDB
      PMA_PORT: 3306
    depends_on:
      - db


# =====================================================================
#  Volúmenes nombrados (para que los datos de la BD no se borren al
#  apagar el contenedor).
# =====================================================================
volumes:
  db_data:
